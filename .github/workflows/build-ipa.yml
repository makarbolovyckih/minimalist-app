name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: xcode-27   # GitHub's Xcode 27 image (iOS 27 SDK, needed for the extra-large widget)
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version); echo "iOS SDK $SDK"
          [ "${SDK%%.*}" -ge 27 ] || { echo "iOS 27 SDK required for the extra-large widget"; exit 1; }
      - run: brew install xcodegen ldid && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Blank.xcodeproj -scheme Blank -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP=build/Build/Products/Release-iphoneos/Blank.app
          # Version 1: with App Group entitlements (in-app editor syncs to the widget)
          mkdir -p sync/Payload nosync/Payload
          cp -R $APP sync/Payload/ && cp -R $APP nosync/Payload/
          ldid -Ssigning/widget.entitlements sync/Payload/Blank.app/PlugIns/BlankWidget.appex/BlankWidget
          ldid -Ssigning/app.entitlements sync/Payload/Blank.app/Blank
          (cd sync && zip -qr ../Blank.ipa Payload)
          # Version 2: no App Group (use if Sideloadly refuses the first one)
          (cd nosync && zip -qr ../Blank-no-sync.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Blank-ipa
          path: |
            Blank.ipa
            Blank-no-sync.ipa
