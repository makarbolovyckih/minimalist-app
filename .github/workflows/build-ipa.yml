name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest   # switch to a newer image if it ships Xcode 27 and macos-latest doesn't
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: brew install xcodegen && xcodegen generate
      - name: Build unsigned
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          FLAGS='$(inherited)'
          if [ "${SDK%%.*}" -ge 27 ]; then FLAGS="$FLAGS XL_PORTRAIT"; echo "Building WITH iOS 27 extra-large widget"; else echo "SDK < 27: extra-large widget NOT included"; fi
          xcodebuild -project Blank.xcodeproj -scheme Blank -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$FLAGS"
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Blank.app Payload/
          zip -qr Blank.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Blank-ipa
          path: Blank.ipa
